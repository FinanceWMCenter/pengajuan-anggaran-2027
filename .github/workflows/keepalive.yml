# Memanggil rpc_ping tiap 3 hari agar project Supabase (paket Free) tidak tertidur.
# Butuh Variables repo: SUPABASE_URL dan SUPABASE_ANON_KEY (nilai publik, sama dengan web/config.js).
# Settings -> Secrets and variables -> Actions -> tab Variables.
name: Keepalive Supabase

on:
  schedule:
    - cron: '17 1 */3 * *'   # tiap 3 hari, 08:17 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil rpc_ping
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Variables SUPABASE_URL / SUPABASE_ANON_KEY belum diisi di Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          AUTH=()
          case "$SUPABASE_ANON_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_ANON_KEY");; esac
          RESP=$(curl -sS --fail-with-body --max-time 30 -X POST "${SUPABASE_URL%/}/rest/v1/rpc/rpc_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" "${AUTH[@]}" -H "Content-Type: application/json" -d '{}')
          echo "Jawaban: $RESP"
          echo "$RESP" | grep -q '"ok" *: *true' || { echo "::error::rpc_ping tidak mengembalikan ok:true"; exit 1; }
